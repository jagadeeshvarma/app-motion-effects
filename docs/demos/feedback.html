<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Loading and connection examples</title>
    <link rel="stylesheet" href="feedback.css" />
    <script src="feedback.js" defer></script>
  </head>
  <body>
    <main>
      <header><h1 id="heading">Projects</h1></header>
      <div id="notice" hidden></div>
      <div id="content"></div>
      <div id="actions" class="actions"></div>
      <div id="note-field" hidden>
        <label for="note">Project note</label
        ><input id="note" value="Send the draft for review." />
      </div>
      <p id="status" role="status" aria-live="polite">Ready to try.</p>
    </main>
  </body>
</html>
