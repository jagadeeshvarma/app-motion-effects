<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
  /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Dispatch desk demo</title
  ><style>
    :root {
      --canvas: #edf0ef;
      --surface: #fff;
      --ink: #172b32;
      --muted: #4c6067;
      --accent: #245865;
      --line: #a8b5b9;
      --space: 12px;
      --radius: 4px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 14px/1.5 system-ui;
    }
    main {
      max-width: 980px;
      margin: 32px auto;
      padding: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    .desk {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 16px;
    }
    .records {
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .records li {
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      margin-bottom: 8px;
    }
    .records li[aria-current] {
      border-color: var(--accent);
      border-width: 2px;
    }
    .records strong,
    .records span {
      display: block;
    }
    .records span {
      color: var(--muted);
    }
    .note-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 20px;
      border-radius: var(--radius);
      min-width: 0;
    }
    label {
      display: block;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      font: inherit;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 10px;
      border-radius: var(--radius);
    }
    button {
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      min-height: 44px;
      padding: 9px 14px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    :focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }
    .actions {
      margin-top: 12px;
    }
    #feedback {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--muted);
    }
    .review-controls {
      margin-top: 28px;
      border: 1px dashed var(--line);
      padding: 12px;
      color: var(--muted);
    }
    .review-controls label {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    small {
      display: block;
      margin-top: 16px;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      main {
        margin: 12px auto;
      }
      .desk {
        grid-template-columns: 1fr;
      }
      .records {
        display: flex;
        gap: 8px;
      }
      .records li {
        flex: 1;
        min-width: 0;
        padding: 8px;
      }
      .records span {
        overflow-wrap: anywhere;
      }
      .note-panel {
        padding: 16px;
      }
    }
  </style>
  <main>
    <h1>Dispatch desk</h1>
    <div class="desk">
      <ul class="records" aria-label="Parcel records">
        <li aria-current="true">
          <strong>Parcel 1042</strong><span>Awaiting collection</span>
        </li>
        <li><strong>Parcel 1043</strong><span>Label review</span></li>
      </ul>
      <section class="note-panel" aria-label="Parcel 1042 handling">
        <h2>Parcel 1042</h2>
        <form>
          <label for="handling-note">Handling note</label
          ><textarea id="handling-note" required>
Use the loading entrance after 16:00.</textarea>
          <div class="actions"><button type="submit">Save note</button></div>
        </form>
        <p id="feedback" role="status" aria-live="polite"></p>
      </section>
    </div>
    <fieldset class="review-controls">
      <legend>Local test controls</legend>
      <label
        ><input id="fail-next" type="checkbox" />Simulate next save
        failure</label
      >
    </fieldset>
    <small>Local synthetic demonstration. Nothing is sent.</small>
  </main>
  <script>
    const form = document.querySelector("form"),
      field = document.querySelector("textarea"),
      button = form.querySelector("button"),
      feedback = document.querySelector("#feedback"),
      fail = document.querySelector("#fail-next");
    let saved = field.value;
    window.demoSavedValue = () => saved;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (button.disabled) return;
      const submitted = field.value,
        willFail = fail.checked;
      fail.checked = false;
      button.disabled = true;
      button.textContent = "Saving";
      feedback.textContent = "Updating handling note";
      setTimeout(() => {
        button.disabled = false;
        button.textContent = "Save note";
        if (willFail) {
          feedback.textContent =
            "Save failed. Your note is still here. Try again.";
          return;
        }
        saved = submitted;
        feedback.textContent = "Handling note saved";
      }, 600);
    });
  </script>
  <style>
    html[data-review-reduced="true"] #feedback[data-state] {
      animation: none;
    }
  </style>
  <script>
    // Same-origin, parent-only review controls. No requests or persisted data.
    window.reviewReducedMotion = false;
    let reviewReplayTimer;
    for (const type of ["pointerdown", "keydown", "input"]) {
      document.addEventListener(type, () => clearTimeout(reviewReplayTimer));
    }
    window.addEventListener("message", (event) => {
      if (
        event.source !== parent ||
        event.origin !== location.origin ||
        event.data?.type !== "app-motion-demo"
      )
        return;
      window.reviewReducedMotion = Boolean(event.data.reduced);
      document.documentElement.dataset.reviewReduced = String(
        window.reviewReducedMotion,
      );

      if (event.data.action !== "replay") return;
      clearTimeout(reviewReplayTimer);
      document.querySelector("form").requestSubmit();
    });
  </script>
</html>
