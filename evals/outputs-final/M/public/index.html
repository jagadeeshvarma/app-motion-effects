<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance rounds</title><link rel="stylesheet" href="styles.css"></head><body><main><p class="notice">Local demonstration. Synthetic records. Nothing is sent.</p><h1>Maintenance rounds</h1><ol id="rounds" aria-label="Task order"><li data-task="valve" id="row-valve"><h2>Valve check</h2><label for="note-valve">Notes for valve check</label><input id="note-valve" type="text" value="Inspect seal"><label><input id="done-valve" type="checkbox">Completed</label><div class="actions"><button id="up-valve" data-direction="-1" data-id="valve" aria-label="Move valve check up" type="button">Move up</button><button id="down-valve" data-direction="1" data-id="valve" aria-label="Move valve check down" type="button">Move down</button></div></li><li data-task="pump" id="row-pump"><h2>Pump check</h2><label for="note-pump">Notes for pump check</label><input id="note-pump" type="text" value="Read pressure"><label><input id="done-pump" type="checkbox">Completed</label><div class="actions"><button id="up-pump" data-direction="-1" data-id="pump" aria-label="Move pump check up" type="button">Move up</button><button id="down-pump" data-direction="1" data-id="pump" aria-label="Move pump check down" type="button">Move down</button></div></li><li data-task="meter" id="row-meter"><h2>Meter check</h2><label for="note-meter">Notes for meter check</label><input id="note-meter" type="text" value="Read meter"><label><input id="done-meter" type="checkbox">Completed</label><div class="actions"><button id="up-meter" data-direction="-1" data-id="meter" aria-label="Move meter check up" type="button">Move up</button><button id="down-meter" data-direction="1" data-id="meter" aria-label="Move meter check down" type="button">Move down</button></div></li></ol><p id="feedback" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></body></html>
